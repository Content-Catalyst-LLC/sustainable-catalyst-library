services:
  sc-library-web:
    build: .
    container_name: sc-library-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SC_LIBRARY_WEB_BIND_PORT:-8092}:8080"
    networks:
      - sc-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  sc-internal:
    external: true
