services:
  library-backend:
    build: .
    container_name: sc-library-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8087:8080"
    networks:
      - sc-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  sc-internal:
    external: true
