services:
  library-backend:
    build: .
    container_name: sc-library-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8087:8080"
    depends_on:
      sc-library-ingestion:
        condition: service_healthy
      sc-library-redis:
        condition: service_healthy
    environment:
      SC_LIBRARY_GO_INGESTION_URL: http://sc-library-ingestion:8090
      SC_LIBRARY_JOB_REDIS_URL: redis://sc-library-redis:6379/0
      SC_LIBRARY_ARTIFACT_FILESYSTEM_ROOT: /data/artifacts
    volumes:
      - sc-library-artifact-data:/data/artifacts
    networks:
      - sc-internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  sc-library-redis:
    image: redis:7.4-alpine
    container_name: sc-library-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - sc-library-redis-data:/data
    networks:
      - sc-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 4s
      retries: 5
      start_period: 5s

  sc-library-ingestion:
    build:
      context: ./go-ingestion-runtime
    container_name: sc-library-ingestion
    restart: unless-stopped
    environment:
      SC_LIBRARY_GO_PORT: "8090"
      SC_LIBRARY_GO_MAX_QUEUE: "${SC_LIBRARY_GO_MAX_QUEUE:-5000}"
      SC_LIBRARY_GO_MAX_IN_FLIGHT: "${SC_LIBRARY_GO_MAX_IN_FLIGHT:-32}"
      SC_LIBRARY_GO_STATE_FILE: /data/jobs.json
    volumes:
      - sc-library-ingestion-data:/data
    networks:
      - sc-internal
    healthcheck:
      test: ["CMD", "/sc-library-ingestion-runtime", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  sc-library-worker-python:
    build: .
    container_name: sc-library-worker-python
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      library-backend: {condition: service_healthy}
      sc-library-redis: {condition: service_healthy}
    environment:
      SC_LIBRARY_WORKER_PROFILE: python.research
    command: ["python", "-m", "app.worker_agent", "--profile", "python.research"]
    volumes:
      - sc-library-artifact-data:/data/artifacts
    networks: [sc-internal]

  sc-library-worker-go:
    build: .
    container_name: sc-library-worker-go
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      library-backend: {condition: service_healthy}
      sc-library-ingestion: {condition: service_healthy}
    environment:
      SC_LIBRARY_WORKER_PROFILE: go.ingestion
      SC_LIBRARY_GO_INGESTION_URL: http://sc-library-ingestion:8090
    command: ["python", "-m", "app.worker_agent", "--profile", "go.ingestion"]
    volumes:
      - sc-library-artifact-data:/data/artifacts
    networks: [sc-internal]

  sc-library-worker-rust:
    build: .
    container_name: sc-library-worker-rust
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      library-backend: {condition: service_healthy}
    environment:
      SC_LIBRARY_WORKER_PROFILE: rust.graph
    command: ["python", "-m", "app.worker_agent", "--profile", "rust.graph"]
    volumes:
      - sc-library-artifact-data:/data/artifacts
    networks: [sc-internal]

volumes:
  sc-library-ingestion-data:
  sc-library-redis-data:
  sc-library-artifact-data:

networks:
  sc-internal:
    external: true
